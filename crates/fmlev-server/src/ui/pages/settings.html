
    <section id="tab-settings" class="tab-view">
      <div class="card" id="settings-card">
        <h3 style="font-size: 15px; font-weight: 800; margin-bottom: 6px;">Display Settings</h3>
        <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 14px;">
          These change how values are shown and typed. The game always stores raw GBP (wages per week) and metric units;
          settings never write game memory. Rates are a fixed table, not live exchange rates.
        </p>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Currency</label>
            <select id="settings-currency" class="form-control" onchange="saveDisplaySettings()"></select>
            <div id="settings-rate" style="font-size: 11px; color: var(--text-dim); margin-top: 4px;"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Measurement</label>
            <select id="settings-measurement" class="form-control" onchange="saveDisplaySettings()">
              <option value="metric">Metric (cm, kg, km)</option>
              <option value="imperial">Imperial (ft/in, lb, miles)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Contract wage period</label>
            <select id="settings-wage-period" class="form-control" onchange="saveDisplaySettings()">
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly (weekly x 52 / 12)</option>
              <option value="yearly">Yearly (weekly x 52)</option>
            </select>
            <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">Club wage budget and max wage stay raw: their period is unverified.</div>
          </div>
        </div>
        <div id="settings-preview" style="margin-top: 12px; font-size: 12px; color: var(--accent-cyan);"></div>
      </div>
    </section>
