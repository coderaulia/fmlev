<!DOCTYPE html>
<html lang="en" class="dark">
<!-- Architecture Reference: Squad God Mode, Player Editor, Club Finances, Memory Scanner, fmlev 26 engine. Shell: sidebar + top bar + context header + sub-tabs + pages + save bar (docs/UI_ARCHITECTURE.md) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMLE by Vanaila - Football Manager Live Editor</title>
  <style>
/*@STYLES*/
  </style>
</head>
<body>
  <div id="app-shell">

    <!-- Left navigation (items are rendered by Shell.init from Shell.NAV) -->
    <aside id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="brand-title">FM<b>LE</b></div>
        <div class="brand-sub">by Vanaila</div>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-foot">Football Manager Live Editor</div>
    </aside>

    <div id="app-main">

      <!-- Top bar: connection status, global search, quick controls -->
      <header id="topbar">
        <div class="topbar-container">
          <button type="button" id="sync-pill" class="sync-indicator unsynced" onclick="toggleAutoAttach()" title="Click to refresh connection to FM26" role="button" tabindex="0">
            <span class="sync-dot"></span>
            <span id="sync-status-text">Waiting for FM26...</span>
          </button>

          <div class="search-wrapper">
            <span class="search-icon">&#128269;</span>
            <input
              id="global-search" aria-label="Search all entities" aria-controls="search-results-dropdown"
              type="text"
              class="search-input-box"
              placeholder="Search players, staff, clubs, nations, competitions   ( / )"
              autocomplete="off"
              oninput="handleSearchInput(this.value)"
              onkeydown="handleSearchKey(event)"
            >
            <button type="button" id="search-clear-btn" class="search-clear" onclick="clearSearch()" aria-label="Clear search">&#10005;</button>
            <div id="search-results-dropdown" class="search-dropdown"></div>
          </div>

          <div class="top-controls">
            <button id="discover-players-btn" class="btn" onclick="discoverLoadedPlayers()" title="Open one player's Attributes screen first, then index loaded native player records for search">Scan Loaded Players</button>
            <button id="pin-btn" class="btn" onclick="togglePinPlayer()" title="Pin player to stop auto-following the game screen">Pin Player</button>
            <button id="overlay-mode-btn" class="btn" onclick="toggleOverlayMode()" title="Toggle compact overlay HUD for in-game use">Compact Overlay</button>
          </div>
        </div>
      </header>

      <div id="search-filters" class="search-filters" role="group" aria-label="Search types" hidden>
        <span>Search:</span>
        <button class="btn btn-sm" data-search-type="all" aria-pressed="true" onclick="setSearchFilter('all')">All</button>
        <button class="btn btn-sm" data-search-type="players" aria-pressed="false" onclick="setSearchFilter('players')">Players</button>
        <button class="btn btn-sm" data-search-type="staff" aria-pressed="false" onclick="setSearchFilter('staff')">Staff</button>
        <button class="btn btn-sm" data-search-type="clubs" aria-pressed="false" onclick="setSearchFilter('clubs')">Clubs</button>
        <button class="btn btn-sm" data-search-type="nations" aria-pressed="false" onclick="setSearchFilter('nations')">Nations</button>
        <button class="btn btn-sm" data-search-type="competitions" aria-pressed="false" onclick="setSearchFilter('competitions')">Competitions</button>
      </div>

      <!-- Context header: current entity + history -->
      <div id="context-header">
        <div class="context-nav">
          <button id="context-back" class="btn btn-ghost" onclick="Shell.back()" title="Back" disabled>&#8592;</button>
          <button id="context-forward" class="btn btn-ghost" onclick="Shell.forward()" title="Forward" disabled>&#8594;</button>
        </div>
        <div class="context-text">
          <div id="context-title">FMLE</div>
          <div id="context-subtitle"></div>
        </div>
        <div id="context-actions" class="context-actions"></div>
      </div>

      <!-- Sub-tab row (filled by Shell.setSubTabs) -->
      <div id="subtabs" role="tablist" hidden></div>

      <!-- Pages: one <section class="tab-view" id="tab-..."> each -->
      <main>

<!--@PAGES-->

      </main>

      <!-- Save bar: one per app, bound to the active page (SaveBar) -->
      <div id="savebar" hidden>
        <div id="savebar-popover" hidden></div>
        <span id="savebar-status" role="status" aria-live="polite">No unsaved changes</span>
        <button id="savebar-review" class="btn btn-ghost btn-sm" onclick="SaveBar.toggleReview()" hidden>Review</button>
        <span id="savebar-error"></span>
        <div class="savebar-actions">
          <button id="savebar-load" class="btn" onclick="SaveBar.load()" title="Read the current values from the game">Load from game</button>
          <button id="savebar-discard" class="btn" onclick="SaveBar.discard()" disabled>Discard</button>
          <button id="savebar-save" class="btn btn-primary" onclick="SaveBar.save()" disabled title="Ctrl+S">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
/*@SCRIPTS*/
  </script>
</body>
</html>
