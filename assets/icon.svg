<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6"/>

  <!-- Glowing Pitch Circle -->
  <circle cx="128" cy="128" r="85" fill="#131b2e" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
  
  <!-- Center pitch line -->
  <line x1="43" y1="128" x2="213" y2="128" stroke="#10b981" stroke-width="2.5" opacity="0.7"/>
  <circle cx="128" cy="128" r="32" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>
  <circle cx="128" cy="128" r="5" fill="#f59e0b"/>

  <!-- Typography -->
  <text x="128" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glow)">FMLE</text>
  <text x="128" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="4">BY VANAILA</text>
</svg>
