
    <section id="tab-status" class="tab-view">
      <div class="card">
        <h3 style="font-size: 15px; font-weight: 800; margin-bottom: 14px;">Game Connection & Linux Diagnostics</h3>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 16px;">
          <div class="form-group">
            <label class="form-label">Connection State</label>
            <div id="diag-conn-state" style="font-weight: 700; color: var(--accent-emerald);">Checking...</div>
          </div>
          <div class="form-group">
            <label class="form-label">FM26 Process PID</label>
            <div id="diag-pid" style="font-family: monospace; font-weight: 700;">-</div>
          </div>
          <div class="form-group">
            <label class="form-label">Proton / Wine Runtime</label>
            <div id="diag-proton" style="font-weight: 700;">Linux Native / Steam Proton</div>
          </div>
          <div class="form-group">
            <label class="form-label">Active Screen Detection</label>
            <div id="diag-screen" style="font-weight: 700; color: var(--accent-cyan);">Auto-Following Screen</div>
          </div>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn btn-primary" onclick="toggleAutoAttach()">
            🔄 Re-scan & Attach to FM26
          </button>
        </div>
      </div>
    </section>
