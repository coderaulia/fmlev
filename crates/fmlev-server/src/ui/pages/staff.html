    <!-- STAFF: search, profile header, ability tabs (Head Coach / Coaching / Scouting / Medical). Load and Save live in the save bar. -->
    <section id="tab-staff" class="tab-view">
      <div class="card staff-search-card">
        <div class="staff-search-row">
          <input id="staff-query" type="text" class="form-control" placeholder="Search staff by name (2+ letters)" onkeydown="if (event.key === 'Enter') searchStaff()">
          <button class="btn btn-primary" onclick="searchStaff()">Search</button>
          <label class="staff-experimental-toggle">
            <input id="staff-experimental" type="checkbox" onchange="toggleStaffEditing(this.checked)">
            <span>Enable experimental staff editing (throwaway save only)</span>
          </label>
        </div>
        <p class="unverified-note">
          Reads any staff member from game memory, no screen needed. Values are the 1-20 numbers behind FM26's ability labels.
          Editing is experimental: writes are checked by readback but not yet proven after a day tick and save/reload.
        </p>
        <div id="staff-results" class="staff-results"></div>
      </div>
      <div id="staff-profile" class="staff-profile" hidden>
        <div id="staff-header" class="staff-header"></div>
        <div id="staff-detail" class="staff-detail"></div>
      </div>
    </section>
